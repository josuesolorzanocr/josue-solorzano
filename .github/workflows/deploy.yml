# Antes este workflow intentaba desplegar a Vercel con la CLI, pero los
# secretos VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID nunca se
# configuraron en el repositorio: fallaba en cada corrida.
#
# Quien despliega de verdad es la integración nativa de Vercel con GitHub
# (proyecto `josuesolorzano-cr`). Duplicarlo aquí sólo producía alarmas
# falsas y, peor, hacía que el job de lint arrastrara a los de despliegue.
#
# Este workflow se queda con lo único que aporta: revisar que el código
# pase lint y tipos antes de mergear.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
